<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FinNex — Texniki İşlər</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            text-align: center;
            padding: 2rem;
            max-width: 480px;
        }

        .logo {
            font-size: 1.6rem;
            font-weight: 700;
            color: #60a5fa;
            margin-bottom: 2.5rem;
            letter-spacing: -0.5px;
        }

        .logo span { color: #94a3b8; font-weight: 400; }

        .icon {
            width: 72px;
            height: 72px;
            background: rgba(96,165,250,0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
        }

        .icon svg {
            width: 36px;
            height: 36px;
            stroke: #60a5fa;
            fill: none;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            animation: spin 3s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #f1f5f9;
            margin-bottom: 0.75rem;
        }

        p {
            color: #94a3b8;
            line-height: 1.7;
            font-size: 0.95rem;
            margin-bottom: 0.5rem;
        }

        .badge {
            display: inline-block;
            margin-top: 1.5rem;
            padding: 0.4rem 1rem;
            background: rgba(96,165,250,0.1);
            border: 1px solid rgba(96,165,250,0.2);
            border-radius: 999px;
            font-size: 0.8rem;
            color: #60a5fa;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">BMI <span>Finance</span></div>

        <div class="icon">
            <svg viewBox="0 0 24 24">
                <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
            </svg>
        </div>

        <h1>Sistem yenilənir</h1>
        <p>Hal-hazırda texniki yeniləmə aparılır.</p>
        <p>Bir neçə dəqiqədən sonra yenidən cəhd edin.</p>

        <div class="badge">⚙ Texniki işlər davam edir</div>
    </div>
</body>
</html>
